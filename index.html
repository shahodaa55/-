<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>التحليل الأكاديمي للطلاب</title>
</head>

<body>

<script>

class Student {

    constructor(رقم_الجلوس, الاسم, الدرجات, نسبة_الحضور) {
        this.id = رقم_الجلوس;
        this.name = الاسم;
        this.grades = الدرجات;
        this.attendance = نسبة_الحضور;
    }



    حساب_المتوسط() {

        let مجموع_الدرجات = this.grades.reduce(
            (المجموع, الدرجة) => المجموع + الدرجة, 0
        );

        return مجموع_الدرجات / this.grades.length;
    }



    تحديد_التقدير() {

        let المتوسط = this.حساب_المتوسط();

        if (المتوسط >= 90) {
            return "A";
        } else if (المتوسط >= 80) {
            return "B";
        } else if (المتوسط >= 70) {
            return "C";
        } else if (المتوسط >= 60) {
            return "D";
        } else if (المتوسط >= 50) {
            return "E";
        } else {
            return "F";
        }
    }


  

    تحديد_النتيجة() {

        let المتوسط = this.حساب_المتوسط();

        if (المتوسط >= 50 && this.attendance >= 75) {
            return "ناجح";
        } else {
            return "يحتاج مراجعة";
        }
    }
}


let قائمة_الطلاب = [

    new Student(301, "شهد", [88, 92, 90], 95),

    new Student(302, "إبراهيم", [43, 46, 48], 85),

    new Student(303, "ملك", [75, 80, 85], 90),

    new Student(304, "مصطفى", [40, 45, 47], 70)

];


console.log("===== التقرير الأكاديمي للطلاب =====");

قائمة_الطلاب.forEach((طالب) => {

    console.log("اسم الطالب:", طالب.name);

    console.log("رقم الجلوس:", طالب.id);

    console.log("متوسط الدرجات:", طالب.حساب_المتوسط());

    console.log("التقدير:", طالب.تحديد_التقدير());

    console.log("النتيجة النهائية:", طالب.تحديد_النتيجة());

    console.log("----------------------------");

});



let الطلاب_المتعثرون = قائمة_الطلاب.filter((طالب) => {

    let المتوسط = طالب.حساب_المتوسط();

    return المتوسط >= 40 && المتوسط <= 49;

});



let قائمة_الرأفة = الطلاب_المتعثرون.map((طالب) => {

    return {
        الاسم: طالب.name,
        المتوسط_قبل_الرأفة: طالب.حساب_المتوسط(),
        المتوسط_بعد_الرأفة: طالب.حساب_المتوسط() + 5
    };

});


let مجموع_المتوسطات_الجديدة = قائمة_الرأفة.reduce(
    (المجموع, طالب) => المجموع + طالب.المتوسط_بعد_الرأفة, 0
);




let المتوسط_العام_للرأفة = 0;

if (قائمة_الرأفة.length > 0) {

    المتوسط_العام_للرأفة =
        مجموع_المتوسطات_الجديدة / قائمة_الرأفة.length;

}


console.log("===== تقرير لجنة الرأفة =====");

console.table(قائمة_الرأفة);

console.log("عدد الطلاب المستفيدين:", قائمة_الرأفة.length);

console.log("مجموع المتوسطات بعد الرأفة:", مجموع_المتوسطات_الجديدة);

console.log("المتوسط العام بعد الرأفة:", المتوسط_العام_للرأفة);

</script>

</body>
</html>
